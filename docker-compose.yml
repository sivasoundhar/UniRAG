services:
  # UniRAG API — the whole RAG pipeline (upload/chat/search/health) runs in
  # this one FastAPI process; no separate worker/queue/DB service exists yet.
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Uploaded files and the persistent Chroma index survive a container
      # restart/rebuild, and stay visible/inspectable from the host.
      - ./data:/app/data
    # --- Optional: local-network workaround -----------------------------
    # Uncomment this block only if your network blocks HTTPS to
    # huggingface.co/api.groq.com (e.g. antivirus HTTPS scanning
    # intercepting TLS — see app/config/settings.py). It forces Ollama
    # instead of Groq and loads HF models from your host's cache instead
    # of downloading them, so it needs a local Ollama server and an
    # already-populated Hugging Face cache to work. Not needed — and will
    # break a fresh clone with no cache yet — on a machine with normal
    # network access, where .env's LLM_PROVIDER=groq is what should run.
    #
    # environment:
    #   - HF_HUB_OFFLINE=1
    #   - TRANSFORMERS_OFFLINE=1
    #   - LLM_PROVIDER=ollama
    #   - OLLAMA_HOST=http://host.docker.internal:11434
    # volumes:
    #   - ${USERPROFILE}/.cache/huggingface:/root/.cache/huggingface  # Windows
    #   # - ~/.cache/huggingface:/root/.cache/huggingface             # Linux/Mac
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  # UniRAG UI — thin Streamlit client, talks to `app` only over
  # HTTP via API_BASE_URL. No shared volumes/env with `app` beyond that URL:
  # see streamlit_app/app.py's docstring for why it stays a separate,
  # much smaller image with no ML dependencies of its own.
  streamlit:
    build: ./streamlit_app
    ports:
      - "8501:8501"
    environment:
      # "app" here is the other service's name — Compose's built-in DNS
      # resolves it to that container's address on the shared network.
      - API_BASE_URL=http://app:8000
    depends_on:
      - app
